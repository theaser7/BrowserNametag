<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Nametag</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
            <line x1="7" y1="7" x2="7.01" y2="7"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Browser Nametag</h1>
          <span class="version">v1.0.0</span>
        </div>
      </div>
      <div class="status-indicator" id="statusBadge">
        <span class="status-dot"></span>
        <span class="status-label" id="statusText">Выкл</span>
      </div>
    </header>

    <main class="content">
      <div class="form-group toggle-row">
        <label for="enableToggle" class="label-heading">Включить подмену заголовка</label>
        <label class="switch">
          <input type="checkbox" id="enableToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="form-group">
        <label for="titleInput" class="label-heading">Текст для панели задач</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="titleInput" 
            placeholder="Например: Мой Браузер, Work, Dev" 
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="label-heading">Режим подмены</label>
        <div class="mode-selector">
          <label class="mode-option">
            <input type="radio" name="renameMode" value="replace" checked>
            <div class="mode-box">
              <span class="mode-title">Полная замена</span>
              <span class="mode-desc">Только ваш текст в заголовке</span>
            </div>
          </label>
          <label class="mode-option">
            <input type="radio" name="renameMode" value="prefix">
            <div class="mode-box">
              <span class="mode-title">Префикс</span>
              <span class="mode-desc">Ваш текст + оригинальное имя</span>
            </div>
          </label>
        </div>
      </div>

      <div class="button-group">
        <button id="applyBtn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Применить
        </button>
        <button id="resetBtn" class="btn btn-secondary" title="Сбросить настройки">
          Сбросить
        </button>
      </div>
    </main>

    <footer class="footer">
      <p id="notificationMsg" class="notification-text"></p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
